name: Build SiloVPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút Build thủ công trên giao diện GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Tự động tạo wrapper nếu repo chưa có gradlew để tránh lỗi chmod
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiloVPN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
